<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREE NURSING LICENSE MODEL TEST-03</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f0f4f8;margin:0;padding:14px;color:#172b3a}.container{max-width:800px;margin:auto;background:white;padding:18px;border-radius:13px}header{background:#075b9a;color:white;padding:18px;text-align:center;border-radius:10px}.field{padding:12px;width:100%;border:1px solid #bbb;border-radius:7px;margin:7px 0 13px;font-size:16px}.question{padding:14px;margin:14px 0;border:1px solid #d8e1e8;border-radius:9px}.option{display:block;padding:10px;margin:7px 0;background:#f3f6fa;border-radius:6px;cursor:pointer}.option input{margin-right:8px}.timer{font-size:22px;color:#b3261e;font-weight:bold;text-align:center;position:sticky;top:0;background:#fff;padding:10px}button{background:#087b45;color:white;padding:13px 22px;border:0;border-radius:7px;font-size:17px;cursor:pointer;width:100%}#result{margin-top:18px;padding:14px;background:#eaf7ef;border-radius:9px}.small{color:#637789;font-size:14px}
</style></head><body><div class="container">
<header><h2>FREE NURSING LICENSE MODEL TEST-03</h2><p>DATE: 7 OCT 2026</p><p>FULL MARK: 100 [50+50]</p><p>TOPIC: UNCOMMON NURSING LICENSE QUESTION</p></header>
<h3>পরীক্ষার্থীর তথ্য</h3><label>নাম</label><input class="field" id="student" placeholder="আপনার পূর্ণ নাম"><label>মোবাইল নম্বর</label><input class="field" id="phone" placeholder="01XXXXXXXXX">
<p class="small">মোট ৫০টি প্রশ্ন · প্রতিটি প্রশ্নের মান ২ · সময় ৬০ মিনিট</p><div class="timer" id="timer">সময়: 60:00</div><div id="quiz"></div><button id="submitBtn" onclick="submitExam(false)">SUBMIT EXAM</button><div id="result"></div></div>
<script>
const questions=[{"q": "Normal adult resting pulse rate?", "a": ["40–50/min", "60–100/min", "110–130/min", "140–160/min"], "correct": 1}, {"q": "Which vitamin is essential for synthesis of clotting factors?", "a": ["A", "C", "K", "D"], "correct": 2}, {"q": "Normal resting adult respiratory rate?", "a": ["6–10/min", "12–20/min", "22–30/min", "30–40/min"], "correct": 1}, {"q": "Position commonly used for rectal examination?", "a": ["Supine", "Lithotomy", "Sims’", "Trendelenburg"], "correct": 2}, {"q": "Which cranial nerve carries the sense of smell?", "a": ["Optic", "Olfactory", "Trigeminal", "Vagus"], "correct": 1}, {"q": "The first heart sound (S1) is caused mainly by closure of:", "a": ["Aortic and pulmonary valves", "Mitral and tricuspid valves", "Mitral and aortic valves", "Tricuspid and pulmonary valves"], "correct": 1}, {"q": "Which electrolyte is especially important for cardiac excitability?", "a": ["Potassium", "Iron", "Iodine", "Fluoride"], "correct": 0}, {"q": "Conscious patient with hypoglycaemia who can swallow should receive:", "a": ["Water", "Fast-acting oral glucose", "Insulin", "Protein only"], "correct": 1}, {"q": "Which test monitors warfarin therapy?", "a": ["Bleeding time", "INR", "Serum amylase", "HbA1c"], "correct": 1}, {"q": "Main site of blood filtration in nephron?", "a": ["Loop of Henle", "Collecting duct", "Glomerulus", "Distal tubule"], "correct": 2}, {"q": "Tuberculosis is caused by:", "a": ["Streptococcus pneumoniae", "Mycobacterium tuberculosis", "E. coli", "Clostridium tetani"], "correct": 1}, {"q": "Most effective routine measure to prevent healthcare-associated infection?", "a": ["Double mask", "Hand hygiene", "Routine antibiotics", "Closed windows"], "correct": 1}, {"q": "Pulmonary tuberculosis requires which isolation precaution?", "a": ["Contact", "Droplet", "Airborne", "Protective"], "correct": 2}, {"q": "Vaccination generally produces which immunity?", "a": ["Artificial active", "Natural passive", "Artificial passive", "Innate"], "correct": 0}, {"q": "Which blood component transports most oxygen?", "a": ["Platelets", "Red blood cells", "Plasma", "White blood cells"], "correct": 1}, {"q": "Universal red-cell donor group in emergencies is generally:", "a": ["AB positive", "A positive", "O negative", "B negative"], "correct": 2}, {"q": "Ventrogluteal injection is given into the:", "a": ["Ventrogluteal muscle", "Umbilical area", "Inner forearm", "Scapular area"], "correct": 0}, {"q": "Usual angle for intradermal injection?", "a": ["5–15°", "30°", "45°", "90°"], "correct": 0}, {"q": "Which route usually provides the fastest systemic drug effect?", "a": ["Oral", "Subcutaneous", "Intramuscular", "Intravenous"], "correct": 3}, {"q": "Before medication administration, the nurse should first:", "a": ["Ask another patient", "Verify order and patient identity", "Leave it bedside", "Crush every tablet"], "correct": 1}, {"q": "Common finding in left-sided heart failure?", "a": ["Peripheral cyanosis only", "Pulmonary crackles and dyspnoea", "Enlarged spleen", "Dysuria"], "correct": 1}, {"q": "Priority assessment after thyroidectomy?", "a": ["Bowel sounds", "Airway and breathing", "Visual acuity", "Foot pulses"], "correct": 1}, {"q": "A possible sign of raised intracranial pressure is:", "a": ["Bradycardia with widened pulse pressure", "Increased appetite", "Polyuria only", "Hyperactive bowel sounds"], "correct": 0}, {"q": "Which scale assesses consciousness after head injury?", "a": ["Braden", "Glasgow Coma Scale", "Apgar", "Borg"], "correct": 1}, {"q": "Position that may ease severe breathlessness?", "a": ["Flat supine", "High Fowler’s", "Head-down prone", "Trendelenburg"], "correct": 1}, {"q": "A common early sign of shock is:", "a": ["Tachycardia", "Bradycardia in every case", "Slow capillary refill never occurs", "Increased urine output"], "correct": 0}, {"q": "In the fire response mnemonic RACE, R means:", "a": ["Rescue", "Run", "Report", "Record"], "correct": 0}, {"q": "Which device measures oxygen saturation non-invasively?", "a": ["Sphygmomanometer", "Pulse oximeter", "Peak flow meter", "Otoscope"], "correct": 1}, {"q": "Which test reflects average blood glucose over about 2–3 months?", "a": ["Random glucose", "HbA1c", "Serum sodium", "Blood urea"], "correct": 1}, {"q": "Which hormone lowers blood glucose?", "a": ["Glucagon", "Cortisol", "Insulin", "Adrenaline"], "correct": 2}, {"q": "Which organ produces bile?", "a": ["Pancreas", "Liver", "Gallbladder", "Spleen"], "correct": 1}, {"q": "Main function of pulmonary surfactant?", "a": ["Increase surface tension", "Reduce alveolar surface tension", "Destroy RBCs", "Increase blood viscosity"], "correct": 1}, {"q": "Intrinsic-factor deficiency is associated with:", "a": ["Pernicious anaemia", "Iron overload", "Sickle cell disease", "Haemophilia"], "correct": 0}, {"q": "Which vitamin supports collagen formation and wound healing?", "a": ["Vitamin C", "Vitamin K", "Vitamin B12", "Vitamin D"], "correct": 0}, {"q": "Stage 1 pressure injury is characterised by:", "a": ["Intact skin with non-blanchable redness", "Partial-thickness skin loss", "Full-thickness skin loss", "Exposed bone"], "correct": 0}, {"q": "Best routine action to prevent pressure injuries?", "a": ["Massage reddened areas", "Reposition regularly and assess skin", "Keep skin wet", "Use ring cushion routinely"], "correct": 1}, {"q": "A sterile field is contaminated if it:", "a": ["Is above waist level", "Remains in view", "Becomes wet", "Is opened before use"], "correct": 2}, {"q": "Which instrument is used to listen to internal body sounds?", "a": ["Otoscope", "Stethoscope", "Sphygmomanometer", "Laryngoscope"], "correct": 1}, {"q": "Which pulse is assessed at the heart apex?", "a": ["Radial", "Carotid", "Apical", "Pedal"], "correct": 2}, {"q": "Preferred central pulse site for an adult during CPR?", "a": ["Radial", "Carotid", "Dorsalis pedis", "Temporal"], "correct": 1}, {"q": "Suspected stroke: which action is appropriate?", "a": ["Give food immediately", "Note symptom onset and activate emergency response", "Encourage walking", "Wait until tomorrow"], "correct": 1}, {"q": "A symptom suggestive of deep vein thrombosis is:", "a": ["Unilateral leg swelling and pain", "Itchy eyes", "Earache", "Dry mouth"], "correct": 0}, {"q": "Which vaccine is given at birth in Bangladesh to protect against severe TB?", "a": ["BCG", "MR", "DPT booster", "HPV"], "correct": 0}, {"q": "Apgar score is routinely assessed at:", "a": ["1 and 5 minutes after birth", "30 and 60 minutes", "12 and 24 hours", "Before birth only"], "correct": 0}, {"q": "Which newborn finding needs urgent assessment?", "a": ["Pink hands and feet after transition", "Grunting with chest retractions", "Occasional sneezing", "Sleeping between feeds"], "correct": 1}, {"q": "First stage of labour ends when:", "a": ["Placenta is delivered", "Cervix is fully dilated", "Baby is born", "Contractions begin"], "correct": 1}, {"q": "Position that may relieve supine hypotension in late pregnancy?", "a": ["Flat supine", "Left lateral", "Trendelenburg", "Prone"], "correct": 1}, {"q": "Informed consent requires:", "a": ["Forced agreement", "Understandable information and voluntary decision", "Nurse's signature only", "Consent after procedure"], "correct": 1}, {"q": "Respecting a patient's right to make decisions is:", "a": ["Justice", "Autonomy", "Non-maleficence", "Fidelity"], "correct": 1}, {"q": "Correct documentation practice:", "a": ["Document before care", "Record promptly and accurately", "Erase errors completely", "Share passwords"], "correct": 1}];let remaining=3600,finished=false,clock;
function showQuestions(){document.getElementById("quiz").innerHTML=questions.map((q,i)=>`<div class="question"><b>${i+1}. ${q.q}</b>${q.a.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${o}</label>`).join("")}</div>`).join("");}
function submitExam(auto){if(finished)return;let name=document.getElementById("student").value.trim(),phone=document.getElementById("phone").value.trim();if(!auto&&!name){alert("আপনার নাম লিখুন।");return;}if(!auto&&!/^01\\d{9}$/.test(phone)){alert("সঠিক ১১ সংখ্যার মোবাইল নম্বর লিখুন।");return;}if(!auto&&!confirm("আপনি কি পরীক্ষা জমা দিতে চান?"))return;finished=true;clearInterval(clock);let correct=0,attempted=0;questions.forEach((q,i)=>{let x=document.querySelector(`input[name="q${i}"]:checked`);if(x){attempted++;if(Number(x.value)===q.correct)correct++;}});document.getElementById("quiz").style.display="none";document.getElementById("submitBtn").style.display="none";document.getElementById("result").innerHTML=`<h2>পরীক্ষা সম্পন্ন${auto?" (সময় শেষ)":"!"}</h2><p>নাম: ${safe(name||"নাম দেওয়া হয়নি")}</p><h2 style="color:green">প্রাপ্ত নম্বর: ${correct*2} / 100</h2><p>সঠিক উত্তর: ${correct}/50</p><p>উত্তর দিয়েছেন: ${attempted}টি</p><p>ভুল/উত্তর না দেওয়া: ${50-correct}টি</p><p class="small">এই সংস্করণে ফলাফল শুধু পরীক্ষার্থীর ডিভাইসে দেখা যায়; কেন্দ্রীয় মেধাতালিকায় জমা হয় না।</p>`;}
function safe(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function tick(){if(finished)return;remaining--;let m=Math.floor(remaining/60),s=remaining%60;document.getElementById("timer").textContent=`সময়: ${m}:${String(s).padStart(2,"0")}`;if(remaining<=0)submitExam(true);}
showQuestions();clock=setInterval(tick,1000);
</script></body></html>
